<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Attempts Saver</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <header class="app-header">
    <img id="logo" src="assets/logo.svg" alt="Logo" />
    <h1>Attempts Saver</h1>
  </header>

  <div class="container">
    <div class="theme-toggle">
      <button id="toggle-theme" title="Toggle theme">Toggle theme</button>
    </div>

    <section class="form-container">
      <label for="level-name">Level name</label>
      <input id="level-name" type="text" placeholder="e.g. 123" />

      <label for="level-id">Level ID</label>
      <input id="level-id" type="text" placeholder="numeric id" />

      <label for="id-type">Type</label>
      <select id="id-type" title="Select ID type">
        <option value="online">Online ID</option>
        <option value="local">Local ID</option>
      </select>

      <label for="date">Date (mm/dd/yyyy)</label>
      <input id="date" type="text" placeholder="mm/dd/yyyy" />

      <label for="attempts">Attempts</label>
      <input id="attempts" type="text" placeholder="0" />

      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Optional notes"></textarea>

      <button id="save">Save</button>
      <button id="update">Update</button>
      <button id="cancel-edit">Cancel</button>

      <p class="info-link">You can export or import your attempts below.</p>
    </section>

    <section class="saved-container">
      <h2>Saved Attempts</h2>

      <input id="search" class="buscar" type="text" placeholder="Search by exact level name" />

      <div class="filters">
        <select id="filter-type" title="Filter by type">
          <option value="all">All types</option>
          <option value="online">Online ID</option>
          <option value="local">Local ID</option>
        </select>

        <input id="filter-min-attempts" type="text" placeholder="Min attempts" title="Minimum attempts" />
        <input id="filter-max-attempts" type="text" placeholder="Max attempts" title="Maximum attempts" />
        <input id="filter-date-from" type="text" placeholder="From date (mm/dd/yyyy)" title="From date (mm/dd/yyyy)" />
        <input id="filter-date-to" type="text" placeholder="To date (mm/dd/yyyy)" title="To date (mm/dd/yyyy)" />

        <button id="apply-filters" class="apply-filters">Apply Filters</button>
        <button id="clear-filters">Clear Filters</button>
      </div>

      <div class="backup-controls">
        <button id="export-json">Export JSON</button>
        <button id="export-csv">Export CSV</button>
        <button id="export-txt">Export TXT</button>

        <button id="import-btn">Import JSON</button>
        <input id="import-file" type="file" accept="application/json" style="display:none" />
      </div>

      <div class="stats-panel">
        <p>Total: <strong id="stat-total">0</strong></p>
        <p>Attempts: <strong id="stat-attempts">0</strong></p>
        <p>Average: <strong id="stat-average">0</strong></p>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="sortable" data-col="name">Name</th>
              <th class="sortable" data-col="id">ID</th>
              <th class="sortable" data-col="type">Type</th>
              <th class="sortable" data-col="date">Date</th>
              <th class="sortable" data-col="attempts">Attempts</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- rows rendered here -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
